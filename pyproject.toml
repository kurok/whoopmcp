[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whoopmcp"
version = "0.1.0"
description = "Read-only MCP server for the WHOOP API v2 — query and analyse your own recovery, sleep, strain and workout data from any MCP client"
readme = "README.md"
license = { text = "MIT" }
# The two newest stable Python releases, which is what CI tests. Python has
# no LTS track; 3.13 and 3.14 are supported upstream until 2029 and 2030.
requires-python = ">=3.13"
authors = [
    { name = "whoopmcp contributors" },
]
keywords = ["whoop", "mcp", "model-context-protocol", "health", "fitness", "hrv", "sleep", "quantified-self"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    # Already pulled in transitively by mcp (its own HTTP transport is built
    # on it) -- declared directly here too since server.py now imports it by
    # name for the /health and /ready routes (#27), not just through the SDK.
    "starlette>=1.0,<2",
    # Already pulled in transitively by mcp -> pyjwt[crypto] -> cryptography
    # (and by the keyring extra's own secretstorage on Linux) -- declared
    # directly here too since crypto.py now imports it by name for AES-GCM
    # envelope encryption of tokens at rest (#30). No new supply-chain
    # surface: this makes an already-resolved indirect dependency explicit.
    "cryptography>=42.0,<51",
]

[project.optional-dependencies]
# Store the refresh token in the OS keychain instead of a file on disk.
keyring = ["keyring>=25.0"]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
]
lint = ["ruff>=0.16", "mypy>=1.13"]
security = ["bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
whoopmcp = "whoopmcp.__main__:main"

[project.urls]
Homepage = "https://github.com/kurok/whoopmcp"
Repository = "https://github.com/kurok/whoopmcp"
Issues = "https://github.com/kurok/whoopmcp/issues"
Changelog = "https://github.com/kurok/whoopmcp/blob/main/CHANGELOG.md"
"Privacy Policy" = "https://github.com/kurok/whoopmcp/blob/main/PRIVACY.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whoopmcp" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is the point of a test file, and its fixtures legitimately
# assign literal tokens/secrets (S105/S106) that are never real credentials --
# both are noise here but stay live for src/, where a hardcoded credential
# would be a real finding. S608 (string-built SQL) is likewise noise here and
# only here: the tenancy tests deliberately construct hostile SQL literals to
# prove the store rejects them, and explicit `+` concatenation of those
# literals (the CodeQL-recommended replacement for implicit concatenation in
# a list) is what trips it. It stays live for src/, where string-built SQL
# against caller input would be a real finding.
"tests/*" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.13"
packages = ["whoopmcp"]
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
# Only installed with the `keyring` extra; the import is guarded at runtime.
module = ["keyring"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/whoopmcp"]
branch = true
