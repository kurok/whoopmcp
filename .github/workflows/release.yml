name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: pyproject-build (hash-locked closure, #159)
        run: |
          python -m venv /tmp/tool-build
          /tmp/tool-build/bin/pip install --require-hashes -r .github/requirements/build.txt
          /tmp/tool-build/bin/pyproject-build
      - name: twine check dist/* (hash-locked closure, #159)
        run: |
          python -m venv /tmp/tool-twine
          /tmp/tool-twine/bin/pip install --require-hashes -r .github/requirements/twine.txt
          /tmp/tool-twine/bin/twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: no API token in secrets. Configure the publisher at
    # https://pypi.org/manage/project/whoopmcp/settings/publishing/ first, or
    # this job fails with `invalid-publisher`.
    environment:
      name: pypi
      url: https://pypi.org/p/whoopmcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Pinned by commit, not tag: this is the one third-party action in a
      # `contents: write` job, so whoever controls the tag could otherwise
      # write to this repository on every release (issue #119). v3 and
      # v3.0.2 both point at this commit, so the pin is behaviour-neutral.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
