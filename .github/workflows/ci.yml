name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv pip install --system -e '.[dev,lint]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two newest stable Python releases, matching requires-python.
        # Python has no LTS track; 3.13 and 3.14 are supported upstream until
        # 2029 and 2030 respectively.
        #
        # Both transport modes (#35) are covered by every cell of this matrix
        # WITHOUT a transport axis, because the suite is mode-complete in one
        # run: tests/test_http_transport.py always exercises the real
        # streamable-http ASGI app (health/ready routes, a real MCP JSON-RPC
        # exchange), and everything else always exercises the stdio-mode
        # paths -- tests construct their own Config rather than reading an
        # ambient WHOOPMCP_TRANSPORT, so an env-var axis was verified to
        # produce byte-identical per-test outcomes in both settings (issue
        # #35's review) and would only double this job's cell count while
        # covering nothing. Local mode cannot silently rot mode-wise: its
        # tests are unconditional, not gated behind a matrix value.
        python-version: ["3.13", "3.14"]
        os: [ubuntu-latest]
        # macOS and Windows are checked on the newest version only rather than
        # across the matrix. The token-permission tests are split by platform:
        # POSIX modes are asserted off Windows, and the warning that stands in
        # for them is asserted on it.
        include:
          - python-version: "3.14"
            os: macos-latest
          - python-version: "3.14"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv pip install --system -e '.[dev]'
      - run: pytest -q --cov --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pipx run build
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pipx run pip-audit .
