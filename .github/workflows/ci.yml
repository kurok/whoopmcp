name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv pip install --system -e '.[dev,lint]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two newest stable Python releases, matching requires-python.
        # Python has no LTS track; 3.13 and 3.14 are supported upstream until
        # 2029 and 2030 respectively.
        python-version: ["3.13", "3.14"]
        os: [ubuntu-latest]
        # macOS and Windows are checked on the newest version only rather than
        # across the matrix. The token-permission tests are split by platform:
        # POSIX modes are asserted off Windows, and the warning that stands in
        # for them is asserted on it.
        include:
          - python-version: "3.14"
            os: macos-latest
          - python-version: "3.14"
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv pip install --system -e '.[dev]'
      - run: pytest -q --cov --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pipx run build
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pipx run pip-audit .
